name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: "--bundles appimage,deb"
            archive: Buildflow-Linux.zip
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
            archive: Buildflow-macOS-Apple-Silicon.zip
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
            archive: Buildflow-macOS-Intel.zip
          - name: Windows
            os: windows-latest
            args: "--bundles msi,nsis"
            archive: Buildflow-Windows.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libgtk-3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - name: Install JavaScript workspaces
        run: npm ci
      - name: Generate app icons
        run: npm run tauri --workspace @buildflow/desktop icon ../web/public/brand/icon-512.png
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.target != '' && '-' || '' }}
        with:
          projectPath: apps/desktop
          owner: Nexus-Office-room
          repo: Buildflow-Downloads
          tagName: ${{ github.ref_name }}
          releaseName: "Buildflow Desktop ${{ github.ref_name }}"
          releaseBody: "Download the ZIP for your computer from the Buildflow website. The archives contain installers and installation instructions."
          releaseCommitish: main
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Package Linux installers into a ZIP
        if: runner.os == 'Linux'
        run: |
          echo 'Ubuntu/Debian: open the .deb package with your software installer, or run sudo apt install ./Buildflow_*.deb.' > "$RUNNER_TEMP/README.txt"
          zip -j "$RUNNER_TEMP/${{ matrix.archive }}" "$RUNNER_TEMP/README.txt" apps/desktop/src-tauri/target/release/bundle/deb/*.deb
      - name: Package macOS installer into a ZIP
        if: runner.os == 'macOS'
        run: |
          echo 'Open the .dmg file and drag Buildflow into Applications. This build is unsigned and macOS may show a Gatekeeper warning.' > "$RUNNER_TEMP/README.txt"
          zip -j "$RUNNER_TEMP/${{ matrix.archive }}" "$RUNNER_TEMP/README.txt" "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg
      - name: Package Windows installers into a ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          $files = Get-ChildItem -Path $bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          Set-Content -Path "$env:RUNNER_TEMP/README.txt" -Value 'Run the .exe setup wizard, or open the .msi file with Windows Installer.'
          Compress-Archive -Path ($files.FullName + "$env:RUNNER_TEMP/README.txt") -DestinationPath "$env:RUNNER_TEMP/${{ matrix.archive }}" -Force
      - name: Upload ZIP to downloads release
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/${{ matrix.archive }}" --repo Nexus-Office-room/Buildflow-Downloads --clobber
      - name: Upload Windows ZIP to downloads release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$env:RUNNER_TEMP/${{ matrix.archive }}" --repo Nexus-Office-room/Buildflow-Downloads --clobber
