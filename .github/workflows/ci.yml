name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede superseded runs on the same branch — each push only needs the
# latest verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast when a workspace package lost its manifest or sources
      # (the Addendum-15-rebase failure mode that previously only surfaced
      # as a blocked production deploy three commits later).
      - name: Guard — workspace packages intact
        run: node scripts/check-workspaces.mjs

      # Fail fast when the Vercel deployment config can't match the app
      # location (the Root Directory drift that broke production — see
      # TESTING.md → Deployment). Dashboard checks activate when the
      # VERCEL_TOKEN / VERCEL_PROJECT_ID secrets are configured; otherwise
      # only repo-level checks run.
      - name: Guard — Vercel config matches app location
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/check-vercel-config.mjs --ci

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches local dev (v24)
          cache: npm # package-lock.json is committed

      - name: Install dependencies (workspaces)
        run: npm ci

      # Every workspace has a typecheck script (packages/*, apps/*).
      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Lint (eslint, web app)
        run: npm run lint --workspace apps/web

      # No Supabase env vars needed: every page guards on the env vars and
      # falls back to <SetupRequired />, and API routes are dynamic (never
      # executed at build time) — verified by building with .env.local removed.
      - name: Build web app
        run: npm run build --workspace apps/web

      - name: CLI smoke (help output renders)
        run: npm run start --workspace apps/cli -- --help

  # Full API-token lifecycle against a real Supabase (unit tests cover the
  # logic; this covers the actual HTTP surface). Uses supabase/cli to start
  # a pinned local stack — no cloud credentials involved.
  e2e-token-flow:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (workspaces)
        run: npm ci
      - name: Start local Supabase + apply all migrations
        run: npx supabase db start # applies every migration in supabase/migrations
      - name: Run E2E token flow
        env:
          NEXUS_E2E: "1"
        run: npm run test:e2e
